[package]
name = "freeswitch-types"
version = "3.0.0-beta.1"
edition = "2021"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
description = "FreeSWITCH ESL protocol types: channel state, events, headers, commands, and variables"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voip-rs/freeswitch-esl-tokio"
documentation = "https://docs.rs/freeswitch-types"
keywords = ["freeswitch", "esl", "voip", "telephony", "sip"]
categories = ["network-programming", "api-bindings"]
readme = "README.md"
rust-version = "1.86"
# The C-oracle modules compile only under the workspace's freeswitch_oracle cfg
# (.cargo/config.toml), so the package leaves them out and its tests still build.
exclude = [
    "CLAUDE.md",
    "proptest-regressions/",
    "src/**/c_oracle.rs",
    "src/commands/proptests/",
]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(freeswitch_oracle)"] }

[features]
default = ["serde", "esl"]
serde = ["dep:serde", "sip-header-catalog/serde", "indexmap?/serde"]
esl = ["dep:indexmap", "dep:percent-encoding"]
sdp = []

[package.metadata.docs.rs]
all-features = true

[dependencies]
sip-header-catalog = "1.1"
serde = { version = "1.0", features = ["derive"], optional = true }
percent-encoding = { version = "2", optional = true }
indexmap = { version = "2", optional = true }

[[test]]
name = "render_golden"
required-features = ["esl", "serde"]

[dev-dependencies]
percent-encoding = "2"
serde_json = "1.0"
proptest = { version = "1.11", default-features = false, features = ["std"] }
freeswitch-c-oracle = { path = "../freeswitch-c-oracle" }
sip-header = "1"
