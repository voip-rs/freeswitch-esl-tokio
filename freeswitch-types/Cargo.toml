[package]
name = "freeswitch-types"
version = "1.7.0-rc2"
edition = "2021"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]
description = "FreeSWITCH ESL protocol types: channel state, events, headers, commands, and variables"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voip-rs/freeswitch-esl-tokio"
documentation = "https://docs.rs/freeswitch-types"
keywords = ["freeswitch", "esl", "voip", "telephony", "sip"]
categories = ["network-programming", "api-bindings"]
readme = "README.md"
rust-version = "1.86"
exclude = [
    "CLAUDE.md",
    "proptest-regressions/",
    "tests/",
    "src/**/c_oracle.rs",
    "src/**/tests.rs",
    "src/commands/proptests/",
    "src/test_text.rs",
]

[features]
default = ["serde", "esl"]
serde = ["dep:serde", "sip-header/serde", "indexmap?/serde"]
esl = ["dep:indexmap"]
conference-info = ["sip-header/conference-info"]
sdp = ["dep:sdp-types"]

[package.metadata.docs.rs]
all-features = true

[dependencies]
sip-header = { version = "0.3.13", features = ["draft"] }
serde = { version = "1.0", features = ["derive"], optional = true }
percent-encoding = "2"
indexmap = { version = "2", optional = true }
sdp-types = { version = "0.2", optional = true }

[[test]]
name = "render_golden"
required-features = ["esl", "serde"]

[dev-dependencies]
serde_json = "1.0"
proptest = { version = "1.11", default-features = false, features = ["std"] }
freeswitch-c-oracle = { path = "../freeswitch-c-oracle" }
