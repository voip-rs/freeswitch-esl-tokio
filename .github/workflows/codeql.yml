name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          output: sarif-unfiltered
          upload: never

      # scripts/check-codeql.sh reads this artifact to find patterns that no
      # longer remove anything.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-unfiltered-${{ matrix.language }}
          path: sarif-unfiltered/

      - name: Read filter patterns
        id: patterns
        run: |
          {
            echo 'list<<EOF'
            cat .github/codeql/sarif-filter.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - uses: advanced-security/filter-sarif@2da736ff05ef065cb2894ac6892e47b5eac2c3c0 # v1.1
        with:
          patterns: ${{ steps.patterns.outputs.list }}
          input: sarif-unfiltered/${{ matrix.language }}.sarif
          output: sarif-filtered.sarif

      - name: Summarize filtered results
        env:
          LANGUAGE: ${{ matrix.language }}
        run: scripts/ci-codeql-summary.sh "$LANGUAGE" "sarif-unfiltered/$LANGUAGE.sarif" sarif-filtered.sarif >> "$GITHUB_STEP_SUMMARY"

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: sarif-filtered.sarif
          category: /language:${{ matrix.language }}
